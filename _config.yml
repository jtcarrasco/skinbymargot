#-------------------------------
# General Site Settings
title: "Skin by Margot"
description: > # this means to ignore newlines until "email:"
   Site under construction.

email: hello@example.com

#blog logo
logo: "/assets/images/hero/profile.webp"
float_logo: false # true, false (default)

# blog cover
cover: "/assets/images/hero/about-hero.webp"
about_cover: "/assets/images/hero/home-hero.webp"

name: 'Skin by Margot'
