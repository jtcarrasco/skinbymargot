#-------------------------------
# Build Settings
markdown: kramdown
gems:
  - jemoji
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - vendor
  - .git
  - .jekyll-cache
  - .bundle
  - .gstack

# social icons and sharing options
social:
