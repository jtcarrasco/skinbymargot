- title: Signature Customized Facial
  subtitle: 60 Minutes
  description: >
    Our signature facial is thoughtfully customized to your skin's unique needs, combining a
    luxurious spa experience with a results-driven approach. Using professional iS Clinical
    medical-grade skincare, this treatment cleanses, exfoliates, treats, hydrates, and protects.
    Your experience may include a triple cleanse, customized exfoliation, extractions, targeted
    masques, cold globes, red light therapy, oxygen therapy, and sculpting massage techniques.
    Finished with targeted serums, moisturizer, and SPF for skin that feels nourished, hydrated,
    and beautifully refreshed. Appropriate for most skin types.
  cost: "$200"

